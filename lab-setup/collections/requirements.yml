---
# Collections required by the lab-setup roles.
#
# kubernetes.core  — every kubernetes.core.k8s / k8s_info / helm task.
# ansible.posix    — the short-form `mount`, `sysctl` and `authorized_key`
#                    modules used by the preparing/loadgen roles.
#
# No role currently needs community.general; it is intentionally absent so the
# dependency set stays minimal (the retired preparing_server role was the only
# consumer).
#
# Versions: the system Python here is 3.10, so lab-setup runs ansible-core 2.17.x
# (2.18+ needs Python >= 3.11). kubernetes.core 6.x supports ansible-core 2.17.
collections:
  - name: kubernetes.core
    version: "6.1.0"
  - name: ansible.posix
    version: "2.1.0"