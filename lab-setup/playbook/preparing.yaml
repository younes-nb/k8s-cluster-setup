- name: Prepare all eight lab hosts
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install common packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, git, jq, chrony, python3, python3-yaml]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Enable a synchronized clock
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
    - name: Verify synchronization (up to 60 seconds)
      ansible.builtin.command: chronyc waitsync 12 0.1
      changed_when: false

