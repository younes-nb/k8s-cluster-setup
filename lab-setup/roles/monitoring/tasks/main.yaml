---
# Deploy the monitoring stack on the `monitoring` host (outside the cluster).
#
# Layout:
#   /opt/monitoring/            compose file + configs (rendered from templates)
#   /var/lib/monitoring/{mimir,loki,tempo,grafana}   data (dedicated disk)

- name: Ensure monitoring group is not empty
  ansible.builtin.assert:
    that: groups['monitoring'] | default([]) | length > 0
    fail_msg: "no `monitoring` host in the inventory -- add one under all.children.monitoring"

- name: Resolve the address the cluster will push to
  ansible.builtin.set_fact:
    monitoring_push_address: "{{ monitoring_host | default(ansible_host) | default('10.10.1.1') }}"

# The stack runs under `docker compose`, so the host needs both the engine and
# the v2 compose plugin. `preparing.yaml` only covers the `nodes` group, so a
# fresh monitoring host arrives with neither.
- name: Require a safe Grafana password (alphanumeric or URL-safe characters)
  ansible.builtin.assert:
    that: lookup('env','GRAFANA_ADMIN_PASSWORD') is match('^[A-Za-z0-9_-]{16,}$')
  no_log: true

- name: Install monitoring host exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
- name: Bind monitoring host exporter to private interface
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--web.listen-address={{ monitoring_host }}:9100"'
  register: mon_exporter
- name: Start monitoring host exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: "{{ 'restarted' if mon_exporter.changed else 'started' }}"

- name: Check for Docker
  ansible.builtin.command: docker --version
  register: _docker_check
  changed_when: false
  failed_when: false

- name: Install Docker and the compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  become: true

- name: Verify docker compose is usable
  ansible.builtin.command: docker compose version
  register: _compose_ver
  changed_when: false
  retries: 12
  delay: 5
  until: _compose_ver.rc == 0
  become: true

# The role used to only mkdir under {{ monitoring_data_dir }}, so a fresh host
# put Mimir/Loki on the root filesystem. Format + mount the dedicated disk when
# monitoring_disk_device is set; skip cleanly when it is not (the path may
# already be a mountpoint, as it is today).
- name: Prepare the monitoring data disk
  ansible.builtin.script: setup_monitoring_disk.sh
  args:
    executable: /bin/bash
  environment:
    DEV: "{{ monitoring_disk_device | default('') }}"
    MNT: "{{ monitoring_data_dir }}"
    LABEL: "{{ monitoring_disk_label }}"
    ALLOW_FORMAT: "{{ monitoring_allow_format | bool | ternary('true', 'false') }}"
  become: true
  register: _mon_disk
  changed_when: "'mounted' in (_mon_disk.stdout | default(''))"
  failed_when: _mon_disk.rc != 0

- name: Report disk preparation
  ansible.builtin.debug:
    msg: "{{ _mon_disk.stdout | default('') }}"

- name: Create Docker systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'
- name: Require dedicated monitoring mount before Docker starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/monitoring-mount.conf
    content: |
      [Unit]
      RequiresMountsFor={{ monitoring_data_dir }}
      [Service]
      ExecStartPre=/usr/bin/mountpoint -q {{ monitoring_data_dir }}
    mode: '0644'
  register: mount_guard
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: mount_guard.changed

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ monitoring_base_dir }}"
    - "{{ monitoring_base_dir }}/conf"
    - "{{ monitoring_base_dir }}/conf/grafana/provisioning/datasources"
    - "{{ monitoring_data_dir }}/mimir"
    - "{{ monitoring_data_dir }}/loki"
    - "{{ monitoring_data_dir }}/tempo"
    - "{{ monitoring_data_dir }}/grafana"
    - "{{ monitoring_data_dir }}/alloy"
    - "{{ monitoring_data_dir }}/pyroscope"
    - "{{ monitoring_base_dir }}/conf/rules/anonymous"
    - "{{ monitoring_base_dir }}/conf/grafana/provisioning/dashboards"
    - "{{ monitoring_base_dir }}/conf/grafana/provisioning/dashboards/json"
  become: true

# Each image runs as a non-root UID, so the bind-mounted data dirs must be owned
# by it or the container cannot write (mimir=0, loki=10001, tempo=10001,
# grafana=472). Tempo's image entrypoint IS /tempo (the binary), so its data
# must NOT be mounted at /tempo -- it lives at /var/tempo.
#
# EXISTING DATA IS PRESERVED: ownership is set without ``recurse``, so files
# already inside are never walked or re-owned. On a 120 GB live monitoring disk
# a recursive chown is both slow and risky.
- name: Give each data dir to the UID its image runs as (non-recursive)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0750"
    recurse: false
  loop:
    - {path: "{{ monitoring_data_dir }}/mimir", owner: "0", group: "0"}
    - {path: "{{ monitoring_data_dir }}/loki", owner: "10001", group: "10001"}
    - {path: "{{ monitoring_data_dir }}/tempo", owner: "10001", group: "10001"}
    - {path: "{{ monitoring_data_dir }}/grafana", owner: "472", group: "472"}
    - {path: "{{ monitoring_data_dir }}/alloy", owner: "0", group: "0"}
    - {path: "{{ monitoring_data_dir }}/pyroscope", owner: "0", group: "0"}
  become: true

- name: Render Mimir config
  ansible.builtin.template:
    src: mimir.yaml.j2
    dest: "{{ monitoring_base_dir }}/conf/mimir.yaml"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Install recording rules
  ansible.builtin.template:
    src: autoscaler-rules.yaml.j2
    dest: "{{ monitoring_base_dir }}/conf/rules/anonymous/autoscaler.yaml"
    mode: "0644"
  notify: restart monitoring stack

- name: Install protected Grafana Compose environment
  ansible.builtin.copy:
    dest: "{{ monitoring_base_dir }}/.env"
    content: "GRAFANA_ADMIN_PASSWORD={{ lookup('env','GRAFANA_ADMIN_PASSWORD') }}\n"
    mode: "0600"
  no_log: true
  notify: restart monitoring stack

- name: Render Loki config
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ monitoring_base_dir }}/conf/loki.yaml"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Render Tempo config
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: "{{ monitoring_base_dir }}/conf/tempo.yaml"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Render Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yaml.j2
    dest: "{{ monitoring_base_dir }}/conf/grafana/provisioning/datasources/datasources.yaml"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Render the off-cluster Alloy gateway (OTLP + blackbox + host scrapes)
  ansible.builtin.template:
    src: alloy-gateway.alloy.j2
    dest: "{{ monitoring_base_dir }}/conf/alloy-gateway.alloy"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Provision the Grafana dashboard provider
  ansible.builtin.copy:
    src: dashboards-provider.yaml
    dest: "{{ monitoring_base_dir }}/conf/grafana/provisioning/dashboards/lab.yaml"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Provision the Research Lab dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ monitoring_base_dir }}/conf/grafana/provisioning/dashboards/json/"
    mode: "0644"
  become: true

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_base_dir }}/docker-compose.yml"
    mode: "0644"
  become: true
  notify: restart monitoring stack

- name: Install private ingress firewall script
  ansible.builtin.copy:
    src: guard-monitoring-ports.sh
    dest: /usr/local/sbin/guard-monitoring-ports
    mode: '0750'
- name: Install firewall environment
  ansible.builtin.copy:
    dest: /etc/default/lab-monitoring-firewall
    mode: '0600'
    content: |
      MON_IP={{ monitoring_host }}
      TRUSTED_IPS="{{ cloudlab_private_ips.values() | list | join(' ') }}"
- name: Install firewall service
  ansible.builtin.copy:
    dest: /etc/systemd/system/lab-monitoring-firewall.service
    mode: '0644'
    content: |
      [Unit]
      After=docker.service
      Requires=docker.service
      PartOf=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=/etc/default/lab-monitoring-firewall
      ExecStart=/usr/local/sbin/guard-monitoring-ports
      [Install]
      WantedBy=docker.service
- name: Apply ingress firewall before exposing monitoring services
  ansible.builtin.systemd_service:
    name: lab-monitoring-firewall
    daemon_reload: true
    enabled: true
    state: restarted

- name: Flush handlers (start the stack if it is not running)
  ansible.builtin.meta: flush_handlers

- name: Start the monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitoring_base_dir }}"
  become: true
  register: _compose_up
  changed_when: "'Started' in _compose_up.stdout or 'Created' in _compose_up.stdout"

- name: Wait for Mimir to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_ports.mimir }}/ready"
    return_content: false
  register: _mimir_ready
  until: _mimir_ready.status == 200
  retries: 40
  delay: 5
  changed_when: false

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_ports.loki }}/ready"
    return_content: false
  register: _loki_ready
  until: _loki_ready.status == 200
  retries: 40
  delay: 5
  changed_when: false

- name: Report endpoints
  ansible.builtin.debug:
    msg:
      - "Mimir:  http://127.0.0.1:{{ monitoring_ports.mimir }}  (cluster pushes to http://{{ monitoring_push_address }}:{{ monitoring_ports.mimir }})"
      - "Loki:   http://127.0.0.1:{{ monitoring_ports.loki }}  (cluster pushes to http://{{ monitoring_push_address }}:{{ monitoring_ports.loki }})"
      - "Tempo:  http://127.0.0.1:{{ monitoring_ports.tempo }}"
      - "Grafana: http://{{ monitoring_push_address }}:{{ monitoring_ports.grafana }}"
      - "Data:   {{ monitoring_data_dir }}"

- name: Handlers are declared in handlers/main.yml
  ansible.builtin.meta: noop

