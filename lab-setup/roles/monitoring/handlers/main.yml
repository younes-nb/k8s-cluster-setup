---
- name: restart monitoring mimir
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps --force-recreate mimir
    chdir: "{{ monitoring_base_dir }}"
  become: true
- name: restart monitoring loki
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps --force-recreate loki
    chdir: "{{ monitoring_base_dir }}"
  become: true
- name: restart monitoring tempo
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps --force-recreate tempo
    chdir: "{{ monitoring_base_dir }}"
  become: true
- name: restart monitoring grafana
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps --force-recreate grafana
    chdir: "{{ monitoring_base_dir }}"
  become: true
- name: restart monitoring alloy-gateway
  ansible.builtin.command:
    cmd: docker compose up -d --no-deps --force-recreate alloy-gateway
    chdir: "{{ monitoring_base_dir }}"
  become: true
