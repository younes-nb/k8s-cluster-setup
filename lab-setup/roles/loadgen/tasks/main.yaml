---
- name: Ensure required packages for k6 download
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: yes
  become: true

# k6_version is PINNED (defaults/main.yml). A floating "latest" makes the
# load generator version depend on when the role last ran, which breaks
# comparability between experiment arms. Pass -e k6_version=... to move it.

- name: Verify the pinned k6 version and its SHA256
  ansible.builtin.assert:
    that:
      - k6_version | length > 0
      - k6_sha256 | default('') | length > 0
    fail_msg: >-
      Supply a verified official k6 SHA256 as k6_sha256 (see README). A pinned
      version without a checksum is not reproducible.

# The load testing assets live in the sibling research repo
# (lab-setup/playbook -> repo root -> .. -> sibling).
- name: Download k6 binary
  ansible.builtin.get_url:
    url: "https://github.com/grafana/k6/releases/download/v{{ k6_version }}/k6-v{{ k6_version }}-linux-amd64.tar.gz"
    dest: "/tmp/k6-v{{ k6_version }}-linux-amd64.tar.gz"
    mode: "0644"
    checksum: "sha256:{{ k6_sha256 }}"

- name: Create temp extract directory
  ansible.builtin.file:
    path: /tmp/k6-extract
    state: directory
    mode: "0755"

- name: Extract k6 binary
  ansible.builtin.unarchive:
    src: "/tmp/k6-v{{ k6_version }}-linux-amd64.tar.gz"
    dest: "/tmp/k6-extract"
    remote_src: yes
    extra_opts: [--strip-components=1]

- name: Install k6 binary
  ansible.builtin.copy:
    src: "/tmp/k6-extract/k6"
    dest: "/usr/local/bin/k6"
    mode: "0755"
    remote_src: yes
  become: true

- name: Verify k6 installation
  ansible.builtin.command: /usr/local/bin/k6 version
  register: k6_ver
  changed_when: false

- name: Create loadgen directory
  ansible.builtin.file:
    path: /opt/loadgen
    state: directory
    mode: "0755"

- name: Create loadgen seeds directory
  ansible.builtin.file:
    path: /opt/loadgen/seeds
    state: directory
    mode: "0755"

- name: Install self-contained acceptance workload
  ansible.builtin.copy:
    src: smoke.js
    dest: /opt/loadgen/smoke.js
    mode: '0644'
- name: Install k6 telemetry environment
  ansible.builtin.copy:
    dest: /opt/loadgen/k6.env
    mode: '0644'
    content: |
      export TARGET_URL=http://{{ gateway_private_ip }}
      export K6_PROMETHEUS_RW_SERVER_URL=http://{{ monitoring_host }}:{{ monitoring_mimir_port }}/api/v1/push
      export K6_PROMETHEUS_RW_PUSH_INTERVAL=5s
      export K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
- name: Copy external workload only when explicitly provided
  ansible.builtin.copy:
    src: "{{ load_testing_src }}/"
    dest: /opt/loadgen/research/
    mode: preserve
  when: load_testing_src | default('') | length > 0

- name: Clean up temp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/k6-v{{ k6_version }}-linux-amd64.tar.gz
    - /tmp/k6-extract
# ---- Off-cluster host metrics for the load generator -----------------------
# The loadgen is not a Kubernetes node, so its own node_exporter is what puts
# loadgen CPU/network/disk into Mimir (the Alloy node DaemonSet only covers the
# six cluster nodes).
- name: Install the host exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
  when: loadgen_host_metrics | bool

- name: Bind the host exporter to the private interface
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--web.listen-address={{ cloudlab_private_ips.loadgen }}:9100"'
  register: _exporter_cfg
  when: loadgen_host_metrics | bool

- name: Enable the host exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: "{{ 'restarted' if _exporter_cfg is changed else 'started' }}"
  when: loadgen_host_metrics | bool

