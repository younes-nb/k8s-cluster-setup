---
# Kubelet reservations (declarative).
#
# allocatable = capacity - kubeReserved - systemReserved - evictionHard.
# These are what protect the system daemons and the control plane while the
# masters remain schedulable for the benchmark (see control_plane_isolation.yaml
# for why the taint is off by default).
#
# The node list comes from the API rather than from an inventory group, because
# the lab-setup inventory's `nodes` group also contains `loadgen`, which is not
# a Kubernetes node and has no kubelet.
#
# WARNING: the script restarts kubelet on every node whose config changes. Run
# this with the cluster idle, not during an experiment.
- name: Collect the cluster node list
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    kubeconfig: "{{ kubeconfig_path }}"
  register: _kubelet_nodes
  run_once: true

- name: Fail loudly if the cluster is unreachable
  ansible.builtin.assert:
    that: _kubelet_nodes.resources | length > 0
    fail_msg: "could not list nodes -- is the kube tunnel up?"

- name: Set kubelet reservations on every node
  ansible.builtin.script: setup_kubelet_reservations.sh
  args:
    executable: /bin/bash
  environment:
    KCFG: "{{ kubelet_config_path }}"
    KUBE_CPU: "{{ kubelet_kube_reserved_cpu }}"
    KUBE_MEM: "{{ kubelet_kube_reserved_memory }}"
    SYS_CPU: "{{ kubelet_system_reserved_cpu }}"
    SYS_MEM: "{{ kubelet_system_reserved_memory }}"
    EVICT_MEM: "{{ kubelet_eviction_hard_memory }}"
  loop: "{{ _kubelet_nodes.resources | map(attribute='metadata.name') | list }}"
  delegate_to: "{{ item }}"
  become: true
  register: _kubelet_res
  changed_when: "'patched' in (_kubelet_res.stdout | default(''))"
  failed_when: _kubelet_res is failed

- name: Wait for every node to report Ready again
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ item }}"
  register: _kubelet_ready
  until: >
    _kubelet_ready.resources | length > 0 and
    (_kubelet_ready.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status') | first) == 'True'
  retries: 30
  delay: 6
  loop: "{{ _kubelet_nodes.resources | map(attribute='metadata.name') | list }}"

- name: Report allocatable
  ansible.builtin.debug:
    msg: >-
      kubelet reserved: kubeReserved {{ kubelet_kube_reserved_cpu }}/{{ kubelet_kube_reserved_memory }},
      systemReserved {{ kubelet_system_reserved_cpu }}/{{ kubelet_system_reserved_memory }},
      evictionHard memory.available={{ kubelet_eviction_hard_memory }}.
      Check with: kubectl get nodes -o custom-columns=NAME:.metadata.name,ALLOC:.status.allocatable.cpu