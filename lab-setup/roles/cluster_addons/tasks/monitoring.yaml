---
- name: Read kube-proxy ConfigMap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: kube-proxy
    namespace: kube-system
    kubeconfig: "{{ kubeconfig_path }}"
  register: kp_cm

- name: Adjust metricsBindAddress inside kube-proxy config (config.conf)
  vars:
    original: "{{ (kp_cm.resources[0].data['config.conf'] | default('')) }}"
    patched: "{{ original | regex_replace('metricsBindAddress:\\s*127\\.0\\.0\\.1:10249','metricsBindAddress: 0.0.0.0:10249') }}"
  when: kp_cm.resources | length > 0 and original != ''
  set_fact:
    kubeproxy_config_original: "{{ original }}"
    kubeproxy_config_patched: "{{ patched }}"

- name: Apply patched kube-proxy ConfigMap if changed
  when:
    - kubeproxy_config_original is defined
    - kubeproxy_config_patched is defined
    - kubeproxy_config_original != kubeproxy_config_patched
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kube-proxy
        namespace: kube-system
      data:
        config.conf: "{{ kubeproxy_config_patched }}"
  register: kp_cm_applied

- name: Rollout-restart kube-proxy DaemonSet if config changed
  when: kp_cm_applied is changed
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-proxy
        namespace: kube-system
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -Is') }}"

- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_ns }}"

- name: Add Prometheus Community Helm repo
  kubernetes.core.helm_repository:
    name: "{{ prom_repo_name }}"
    repo_url: "{{ prom_repo_url }}"

- name: Install/upgrade kube-prometheus-stack (Grafana + operators)
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ prom_release_label }}"
    chart_ref: "{{ prom_repo_name }}/kube-prometheus-stack"
    release_namespace: "{{ monitoring_ns }}"
    create_namespace: true
    wait: true
    values:
      grafana:
        defaultDashboardsTimezone: "{{ grafana_timezone }}"
        adminPassword: "{{ grafana_admin_password }}"
        sidecar:
          datasources:
            defaultDatasourceEnabled: false
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: "{{ cert_issuer_name }}"
            kubernetes.io/tls-acme: "true"
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts: ["{{ grafana_host }}"]
          ingressClassName: "{{ ingress_class }}"
          tls:
            - secretName: grafana-general-tls
              hosts: ["{{ grafana_host }}"]
        persistence:
          type: pvc
          enabled: true
          storageClassName: "{{ storage_class }}"
          accessModes: ["ReadWriteOnce"]
          size: "{{ grafana_pvc_size }}"
          finalizers: ["kubernetes.io/pvc-protection"]
        additionalDataSources:
          - name: Mimir
            type: prometheus
            url: "http://mimir.{{ monitoring_ns }}.svc.cluster.local:8080/prometheus"
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: "http://loki.{{ monitoring_ns }}.svc.cluster.local:3100"
            access: proxy
          - name: Tempo
            type: tempo
            url: "http://tempo.{{ monitoring_ns }}.svc.cluster.local:3200"
            access: proxy

      alertmanager:
        enabled: false

      kubeControllerManager:
        service: { port: 10257, targetPort: 10257 }
        serviceMonitor: { enabled: false }

      kubeEtcd:
        enabled: false

      kubeScheduler:
        service: { port: 10259, targetPort: 10259 }
        serviceMonitor: { enabled: false }

      kubeProxy:
        service: { port: 10249, targetPort: 10249 }
        serviceMonitor: { enabled: false }

      kubelet:
        enabled: true
        namespace: kube-system
        serviceMonitor:
          enabled: false

      nodeExporter:
        enabled: false

      prometheus:
        enabled: false
      kubeApiServer:
        serviceMonitor:
          enabled: false
      coreDns:
        serviceMonitor:
          enabled: false
      kubeDns:
        serviceMonitor:
          enabled: false

