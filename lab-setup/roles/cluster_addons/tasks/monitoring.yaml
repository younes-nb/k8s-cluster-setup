---
# kube-prometheus-stack: the operator + kube-state-metrics only.
#
# Grafana is retired in-cluster (it runs on the `monitoring` host), Prometheus
# is retired (Alloy is the scraper), and kube-state-metrics is the one component
# this chart still provides. Everything else is disabled so the chart cannot
# shadow the off-cluster stack.
#
# This task file replaces the old version, which also embedded an in-cluster
# Grafana Deployment with a NodePort, a PVC, an admin password and a timezone --
# none of which belong to this architecture any more.

- name: Ensure the monitoring namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_ns }}"

- name: Add the Prometheus Community Helm repository
  kubernetes.core.helm_repository:
    name: "{{ prom_repo_name }}"
    repo_url: "{{ prom_repo_url }}"

- name: Install/upgrade kube-prometheus-stack (operator + kube-state-metrics)
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ prom_release_label }}"
    chart_ref: "{{ prom_repo_name }}/kube-prometheus-stack"
    chart_version: "{{ prom_stack_version }}"
    release_namespace: "{{ monitoring_ns }}"
    create_namespace: true
    wait: true
    reset_values: true
    values:
      # Grafana is OFF-CLUSTER (roles/monitoring). An in-cluster Grafana would be
      # a second monitoring UI with dead datasources.
      grafana:
        enabled: false
      alertmanager:
        enabled: false
      # Alloy is the scraper. A Prometheus server would be a second one.
      prometheus:
        enabled: false
      nodeExporter:
        enabled: false
      # kube-state-metrics is the only component this chart still provides.
      kubeStateMetrics:
        enabled: true
      kube-state-metrics:
        prometheus:
          monitor:
            enabled: true
            interval: "5s"
            # The chart's default scrape_timeout is 10s, which Alloy rejects
            # outright ("scrape timeout greater than scrape interval") and then
            # drops the whole ServiceMonitor -- every kube_* series disappears.
            scrapeTimeout: "4s"
      kubelet:
        enabled: true
        serviceMonitor: {enabled: false}
      kubeApiServer:
        serviceMonitor: {enabled: true, interval: 5s, scrapeTimeout: 4s}
      coreDns:
        serviceMonitor: {enabled: true, interval: 5s, scrapeTimeout: 4s}
      kubeControllerManager:
        serviceMonitor: {enabled: false} # node Alloy scrapes localhost with TLS
      kubeScheduler:
        serviceMonitor: {enabled: false} # node Alloy scrapes localhost with TLS
      kubeEtcd: {enabled: false}
      kubeProxy:
        serviceMonitor: {enabled: true, interval: 5s, scrapeTimeout: 4s}

- name: Report the monitoring split
  ansible.builtin.debug:
    msg:
      - "kube-state-metrics + the operator are in-cluster ({{ monitoring_ns }})"
      - "Mimir / Loki / Tempo / Grafana / Pyroscope are on {{ monitoring_host }}"
      - "Alloy scrapes in-cluster and remote-writes to {{ monitoring_host }}:{{ monitoring_mimir_port }}"

