---
# Tracing resources only. The in-cluster Tempo Deployment/PVC/Service are gone:
# Tempo now runs on the monitoring host like Mimir/Loki/Grafana (its 10 GiB
# local-path PVC held 43 GB of trace blocks on worker1 and drove the node to the
# kubelet eviction threshold on 2026-11-19).
#
# What remains here is the Istio side: the sampling Telemetry. istiod's
# `otel-tempo` extensionProvider (tasks/istio.yaml) and Alloy both point at
# <monitoring_host>:4317.
- name: Apply tracing resources (Istio Telemetry sampler)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: tempo-mesh.yaml.j2
  register: _tracing_cfg