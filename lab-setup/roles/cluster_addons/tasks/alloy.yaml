---
- name: Get node list for Alloy config
  ansible.builtin.set_fact:
    _alloy_nodes: "{{ groups['nodes'] | default([]) }}"

- name: Render Alloy manifests locally
  ansible.builtin.template:
    src: alloy.yaml.j2
    dest: /tmp/alloy.yaml
    mode: "0644"
  vars:
    nodes_list: "{{ _alloy_nodes }}"
  register: _alloy_template

- name: Apply Alloy manifests
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    apply -f /tmp/alloy.yaml -n {{ monitoring_ns }}
  register: _alloy_apply
  changed_when: _alloy_template.changed

- name: Wait for Alloy deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: alloy
    namespace: "{{ monitoring_ns }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: _alloy_dep
  until: >
    _alloy_dep.resources | length > 0 and
    (_alloy_dep.resources[0].status.availableReplicas | default(0)) >=
    (_alloy_dep.resources[0].spec.replicas | default(1))
  retries: 30
  delay: 10