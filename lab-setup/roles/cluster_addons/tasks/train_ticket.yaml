---

- name: Ensure Train-Ticket namespace exists (Istio injection enabled)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ tt_ns }}"
        labels: >-
          {{
            {'istio-injection': 'enabled'} if tt_enable_istio_injection | bool else {}
          }}

- name: Ensure git is installed
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: yes
  become: true

- name: Clone/Update Train-Ticket repo (shallow, pinned tag)
  ansible.builtin.git:
    repo: "{{ tt_repo_url }}"
    dest: "{{ tt_clone_dir }}"
    version: "{{ tt_repo_version }}"
    depth: 1
    force: true
  register: _tt_git

- name: Stage selector-fixed manifests (upstream 0.0.4 omits spec.selector)
  ansible.builtin.template:
    src: inject_selectors.py
    dest: "{{ tt_clone_dir }}/inject_selectors.py"
    mode: "0755"

- name: Render apply-ready manifests
  ansible.builtin.command: >
    python3 "{{ tt_clone_dir }}/inject_selectors.py"
    "{{ tt_clone_dir }}/deployment/k8s-deployment/ts-deployment-part1.yml"
    "{{ tt_clone_dir }}/deployment/k8s-deployment/ts-deployment-part2.yml"
    "{{ tt_clone_dir }}/deployment/k8s-deployment/ts-deployment-part3.yml"
    "{{ tt_clone_dir }}/deployment/k8s-deployment.ready"
  environment:
    TT_MONGO_IMAGE: "{{ tt_mongo_image }}"
  register: _tt_render
  changed_when: false

- name: Apply Train-Ticket manifests (parts 1-3, jaeger applied then removed below)
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    -n "{{ tt_ns }}"
    apply -f "{{ tt_clone_dir }}/deployment/k8s-deployment.ready/{{ item }}"
  loop:
    - ts-deployment-part1.yml
    - ts-deployment-part2.yml
    - ts-deployment-part3.yml
  register: _tt_apply
  changed_when: >
    ('created' in _tt_apply.stdout) or
    ('configured' in _tt_apply.stdout) or
    ('unchanged' not in _tt_apply.stdout)

- name: Remove jaeger/zipkin leftovers (not part of the serving benchmark)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    kind: "{{ item.kind }}"
    api_version: v1
    name: "{{ item.name }}"
    namespace: "{{ tt_ns }}"
  loop:
    - { kind: Deployment, name: jaeger }
    - { kind: Service, name: jaeger }
    - { kind: Service, name: jaeger-query }
    - { kind: Service, name: jaeger-collector }
    - { kind: Service, name: zipkin }
  ignore_errors: true

- name: Apply ts-avatar-service (absent upstream at {{ tt_repo_version }})
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    template: ts-avatar-service.yaml.j2

- name: Apply dashboard nginx override (adds backend-dialect proxy locations
    so ALL saga traffic can enter through the frontend; rollback = delete
    this ConfigMap + remove the volume below)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ts-ui-dashboard-nginx
        namespace: "{{ tt_ns }}"
      data:
        nginx.conf: "{{ lookup('template', 'dashboard-nginx.conf.j2') }}"

- name: Mount nginx override into ts-ui-dashboard
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    merge_type: strategic-merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ts-ui-dashboard
        namespace: "{{ tt_ns }}"
      spec:
        template:
          spec:
            containers:
              - name: ts-ui-dashboard
                volumeMounts:
                  - name: nginx-override
                    mountPath: /usr/local/openresty/nginx/conf/nginx.conf
                    subPath: nginx.conf
            volumes:
              - name: nginx-override
                configMap:
                  name: ts-ui-dashboard-nginx
                  items:
                    - key: nginx.conf
                      path: nginx.conf

- name: Add readiness probe to ts-ui-dashboard (fixes startup-race 503s)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    merge_type: strategic-merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ts-ui-dashboard
        namespace: "{{ tt_ns }}"
      spec:
        template:
          spec:
            containers:
              - name: ts-ui-dashboard
                readinessProbe:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3

- name: Add liveness probe to ts-user-service (detects a wedged Tomcat Acceptor)
  # ts-user-service loses its Tomcat Acceptor thread to OutOfMemoryError while
  # the JVM stays alive and the listening socket stays open. A tcpSocket probe
  # cannot see that (the kernel still accepts into the backlog) and an httpGet
  # probe treats the app's universal 403 (Spring Security) as failure, so the
  # probe must be an exec that only requires *any* 1xx-5xx status: it proves the
  # application connector answered, and fails when the connector is wedged.
  # Declarative here so a fresh `lab-setup` run cannot silently drop the probe
  # that was previously only `kubectl patch`ed onto the live cluster.
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    merge_type: strategic-merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ts-user-service
        namespace: "{{ tt_ns }}"
      spec:
        template:
          spec:
            containers:
              - name: ts-user-service
                livenessProbe:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - "curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:12342/ | grep -qE '^[1-5][0-9][0-9]$'"
                  initialDelaySeconds: 300
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5

- name: Add DestinationRule for mongo traffic (prevents Envoy idle-timeout closing pooled connections)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: networking.istio.io/v1beta1
      kind: DestinationRule
      metadata:
        name: mongo-idle-timeout
        namespace: "{{ tt_ns }}"
      spec:
        host: "*.{{ tt_ns }}.svc.cluster.local"
        trafficPolicy:
          connectionPool:
            tcp:
              maxConnections: 100
              connectTimeout: 10s
              idleTimeout: 0s
              # 0s disables Envoy's TCP idle timeout for mongo upstreams.
              # Without it the default 1 h idle reap silently kills pooled
              # connections that the mongo driver (3.4.3, maxConnectionLifeTime=0)
              # expects to keep forever -> SocketException / "Prematurely reached
              # end of stream" -> HTTP 500. The previous version of this rule set
              # only maxConnections/connectTimeout despite its name.
              # Disabling the reap alone is NOT sufficient (2026-11-20): with an
              # idle namespace the driver still ended up holding a dead pooled
              # connection, and the first request after a cold reset returned
              # 500 "Prematurely reached end of stream". Two measures make the
              # pool self-healing:
              #   * tcpKeepalive - Envoy probes idle upstreams, so a silently
              #     dead connection is detected in ~60 s instead of hanging;
              #   * maxConnectionDuration - recycle connections before anything
              #     else (conntrack table, node reboot, sidecar restart) can reap
              #     them unnoticed.
              maxConnectionDuration: 30m
              tcpKeepalive:
                time: 30s
                interval: 10s
                probes: 3

- name: Get Train-Ticket deployments
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ tt_ns }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: _tt_deploys

- name: Wait for all Train-Ticket deployments to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.metadata.name }}"
    namespace: "{{ tt_ns }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: _wait_each
  until: >
    _wait_each.resources | length > 0 and
    (_wait_each.resources[0].status.availableReplicas | default(0)) >=
    (_wait_each.resources[0].spec.replicas | default(1))
  retries: "{{ tt_wait_retries }}"
  delay: "{{ tt_wait_delay }}"
  loop: "{{ _tt_deploys.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"


- name: Pin mongo images to {{ tt_mongo_image }} (upstream floats on bare `mongo`)
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    -n "{{ tt_ns }}"
    set image "deployment/{{ item.metadata.name }}"
    "{{ item.metadata.name }}={{ tt_mongo_image }}"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | selectattr('metadata.name', 'match', '.*-mongo$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"
  register: _tt_pin
  changed_when: "'image updated' in _tt_pin.stdout"
  failed_when: false

- name: Set uniform app resources ({{ tt_app_req_cpu }}/{{ tt_app_req_mem }} req, {{ tt_app_lim_cpu }}/{{ tt_app_lim_mem }} lim)
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    -n "{{ tt_ns }}"
    set resources "deployment/{{ item.metadata.name }}"
    -c "{{ item.metadata.name }}"
    --requests="cpu={{ tt_app_req_cpu }},memory={{ tt_app_req_mem }}"
    --limits="cpu={{ tt_app_lim_cpu }},memory={{ tt_app_lim_mem }}"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | rejectattr('metadata.name', 'match', '.*-(mongo|mysql)$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"

# The istio ingress gateway Deployment is applied after the loop above, so it
# never received an HPA and the cold-reset gate (43 stateless deployments, 43
# HPAs) failed with hpa_count=42. The old cluster had this HPA; restore it.
- name: Set DB resource limits ({{ tt_db_lim_cpu }}/{{ tt_db_lim_mem }}; requests stay upstream)
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    -n "{{ tt_ns }}"
    set resources "deployment/{{ item.metadata.name }}"
    -c "{{ item.metadata.name }}"
    --limits="cpu={{ tt_db_lim_cpu }},memory={{ tt_db_lim_mem }}"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | selectattr('metadata.name', 'match', '.*-(mongo|mysql)$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"
  register: _tt_dbres
  changed_when: "'resource requirements updated' in _tt_dbres.stdout"
  failed_when: false

- name: Inject JAVA_TOOL_OPTIONS=-Xmx512m on app containers
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    -n "{{ tt_ns }}"
    set env "deployment/{{ item.metadata.name }}"
    -c "{{ item.metadata.name }}"
    "JAVA_TOOL_OPTIONS={{ tt_java_tool_options }}"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | rejectattr('metadata.name', 'match', '.*-(mongo|mysql)$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"
  register: _tt_env
  changed_when: "'env updated' in _tt_env.stdout"
  failed_when: false

- name: Create per-DB data PVCs ({{ tt_db_pvc_size }}, {{ storage_class }})
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ item.metadata.name }}-data"
        namespace: "{{ tt_ns }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ storage_class }}"
        resources:
          requests:
            storage: "{{ tt_db_pvc_size }}"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | selectattr('metadata.name', 'match', '.*-(mongo|mysql)$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}-data"
  register: _tt_pvc

- name: Bounce DB deployments onto fresh PVCs (only when their PVC was created)
  ansible.builtin.command: >
    kubectl --kubeconfig="{{ kubeconfig_path }}"
    -n "{{ tt_ns }}"
    rollout restart "deployment/{{ item.item.metadata.name }}"
  loop: "{{ _tt_pvc.results }}"
  loop_control:
    label: "{{ item.item.metadata.name }}"
  when: item is changed
  register: _tt_bounce
  changed_when: "'restarted' in _tt_bounce.stdout"
  failed_when: false

- name: Mount data PVCs into mongo deployments ({{ tt_mongo_data_path }})
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    merge_type: strategic-merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ tt_ns }}"
      spec:
        template:
          spec:
            containers:
              - name: "{{ item.metadata.name }}"
                volumeMounts:
                  - name: "{{ item.metadata.name }}-data"
                    mountPath: "{{ tt_mongo_data_path }}"
            volumes:
              - name: "{{ item.metadata.name }}-data"
                persistentVolumeClaim:
                  claimName: "{{ item.metadata.name }}-data"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | selectattr('metadata.name', 'match', '.*-mongo$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Mount data PVCs into mysql deployments ({{ tt_mysql_data_path }})
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    merge_type: strategic-merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ tt_ns }}"
      spec:
        template:
          spec:
            containers:
              - name: "{{ item.metadata.name }}"
                volumeMounts:
                  - name: "{{ item.metadata.name }}-data"
                    mountPath: "{{ tt_mysql_data_path }}"
            volumes:
              - name: "{{ item.metadata.name }}-data"
                persistentVolumeClaim:
                  claimName: "{{ item.metadata.name }}-data"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | selectattr('metadata.name', 'match', '.*-mysql$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Create/Update CPU HPAs (DBs excluded — HPA would scale divergent DB copies)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: "{{ item.metadata.name }}-hpa"
        namespace: "{{ tt_ns }}"
      spec:
        minReplicas: "{{ tt_min_replicas }}"
        maxReplicas: "{{ tt_max_replicas }}"
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: "{{ item.metadata.name }}"
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: "{{ tt_cpu_avg_utilization }}"
  loop: >-
    {{ _tt_deploys.resources | default([])
       | rejectattr('metadata.name', 'match', '.*-(mongo|mysql)$') | list }}
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Create/Update Gateway (HTTP only for private network; HTTPS optional)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    template: gateway.yaml.j2

- name: Create/Update Certificate for Gateway TLS listener (public hosts only)
  when: (tt_host is defined and tt_host) or (grafana_host is defined and grafana_host)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ tt_tls_secret }}"
        namespace: "{{ tt_ns }}"
      spec:
        secretName: "{{ tt_tls_secret }}"
        issuerRef:
          name: "{{ cert_issuer_name }}"
          kind: ClusterIssuer
        dnsNames: >-
          {{ ([tt_host] if (tt_host is defined and tt_host) else [])
             + ([grafana_host] if (grafana_host is defined and grafana_host) else []) }}

- name: Wait for TLS certificate to be Ready (public hosts only)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ tt_tls_secret }}"
    namespace: "{{ tt_ns }}"
  when: (tt_host is defined and tt_host) or (grafana_host is defined and grafana_host)
  register: _tt_cert
  until: >
    (_tt_cert.resources | length) > 0 and
    (
      _tt_cert.resources[0].status.conditions | default([])
      | selectattr('type','equalto','Ready')
      | selectattr('status','equalto','True')
      | list | length
    ) > 0
  retries: 40
  delay: 15
  failed_when: false   # the cert is for the public Grafana gateway; this cluster has none

- name: Report TLS certificate status
  ansible.builtin.debug:
    msg: >-
      TLS certificate {{ tt_tls_secret }} is not Ready ({{ _tt_cert.resources[0].status.conditions | default([]) | selectattr('type','equalto','Ready') | map(attribute='message') | join('; ') | default('unknown') }}).
      This only affects the public Let's Encrypt gateway host ({{ grafana_host | default(tt_host | default('<unset>')) }}); the benchmark and the off-cluster monitoring stack do not use it.

