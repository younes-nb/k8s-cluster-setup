---
# Pinned modern quickstart with a single, documented standalone MySQL topology.
- name: Ensure the Train-Ticket namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ tt_ns }}"

- name: Label the designated workers for the benchmark
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} label node {{ item }}
    lab.example.com/worker=true --overwrite
  loop: "{{ groups['workers'] }}"
  register: _label
  changed_when: "'labeled' in _label.stdout"

- name: Ensure git is installed
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: yes
  become: true

- name: Clone pinned upstream snapshot (do not modify the checkout)
  ansible.builtin.git:
    repo: "{{ tt_repo_url }}"
    dest: "{{ tt_clone_dir }}"
    version: "{{ tt_repo_commit }}"
    force: false
  register: _tt_git

- name: Verify exact source revision
  ansible.builtin.assert:
    that: _tt_git.after == tt_repo_commit

- name: Require explicit readiness configuration and stable database credentials
  ansible.builtin.assert:
    that:
      - tt_require_verified_probes | bool
      - tt_probe_overrides | length > 0
      - tt_infra_probe_overrides | length == 2
      - vault_nacos_db_password | default('') | length > 0
      - vault_nacos_root_password | default('') | length > 0
      - vault_ts_db_password | default('') | length > 0
      - vault_ts_root_password | default('') | length > 0
    fail_msg: Inspect pinned images and supply verified probes and stable encrypted passwords before deployment.
  no_log: true

- name: Refuse to reconcile benchmark during active native HPA operation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: autoscaling/v2
    kind: HorizontalPodAutoscaler
    namespace: "{{ tt_ns }}"
  register: _tt_hpa
- ansible.builtin.assert:
    that:
      - _tt_hpa.resources | length == 0
      - lookup('env', 'LAB_EXCLUSIVE_WRITER_CONFIRMED') == 'true'
    fail_msg: Stop all autoscalers before benchmark deployment; external controllers must be checked separately.

- name: Stage rendering helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ tt_clone_dir }}-{{ item | basename }}"
    mode: '0700'
  loop:
    - prepare_train_ticket.py
    - "{{ role_path }}/templates/inject_selectors.py"

- name: Render and verify application and patched upstream charts before changing DBs
  ansible.builtin.command:
    argv:
      - python3
      - "{{ tt_clone_dir }}-prepare_train_ticket.py"
      - --source
      - "{{ tt_clone_dir }}"
      - --out
      - "{{ tt_clone_dir }}-rendered"
      - --renderer
      - "{{ tt_clone_dir }}-inject_selectors.py"
  environment:
    TT_PROBES: "{{ tt_probe_overrides | to_json }}"
    TT_INFRA_PROBES: "{{ tt_infra_probe_overrides | to_json }}"
    TT_REQUIRE_VERIFIED_PROBES: 'true'
  register: _tt_render
  changed_when: false

- name: Record benchmark identities for secrets and RBAC
  ansible.builtin.set_fact:
    tt_render_inventory: "{{ _tt_render.stdout | from_json }}"

- name: Verify scalable allowlist against pinned manifest
  ansible.builtin.assert:
    that: (tt_render_inventory.deployments | sort) == (tt_scalable_deployments | sort)

- name: Reconcile database instances without deleting StatefulSets or PVCs
  ansible.builtin.include_tasks: train_ticket_mysql.yaml
  loop:
    - {name: nacosdb-mysql, database: nacos, user: nacos, password: "{{ vault_nacos_db_password }}", root_password: "{{ vault_nacos_root_password }}", storage: 10Gi}
    - {name: ts-mysql, database: ts, user: ts, password: "{{ vault_ts_db_password }}", root_password: "{{ vault_ts_root_password }}", storage: "{{ tt_db_pvc_size }}"}
  loop_control:
    loop_var: db
    label: "{{ db.name }}"
  no_log: true

- name: Install or reconcile Nacos with declarative chart corrections
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: nacos
    chart_ref: "{{ tt_clone_dir }}-rendered/nacos"
    release_namespace: "{{ tt_ns }}"
    create_namespace: false
    wait: true
    timeout: 15m
    reset_values: true
    values:
      service: {type: ClusterIP}
      nacos:
        db:
          host: nacosdb-mysql-leader
          username: nacos
          passowrd: "{{ vault_nacos_db_password }}"
          name: nacos
  no_log: true

- name: Install or reconcile RabbitMQ
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: rabbitmq
    chart_ref: "{{ tt_clone_dir }}-rendered/rabbitmq"
    release_namespace: "{{ tt_ns }}"
    create_namespace: false
    wait: true
    timeout: 15m

- name: Reconcile DB Secrets from the exact pinned deployment references
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: "{{ item }}", namespace: "{{ tt_ns }}"}
      type: Opaque
      stringData: "{{ dict([prefix ~ 'HOST', prefix ~ 'PORT', prefix ~ 'DATABASE', prefix ~ 'USER', prefix ~ 'PASSWORD'] | zip(['ts-mysql-leader', '3306', 'ts', 'ts', vault_ts_db_password])) }}"
  vars:
    prefix: "{{ item | regex_replace('^ts-', '') | replace('-', '_') | upper }}_"
  loop: "{{ tt_render_inventory.db_secrets }}"
  no_log: true

- name: Apply actual rendered application manifests
  ansible.builtin.command:
    argv: [kubectl, "--kubeconfig={{ kubeconfig_path }}", -n, "{{ tt_ns }}", apply, -f, "{{ tt_clone_dir }}-rendered/{{ item }}"]
  loop: [svc.yaml, deploy.yaml]
  register: _tt_apply
  changed_when: "'created' in _tt_apply.stdout or 'configured' in _tt_apply.stdout"

- name: Require every application Deployment rollout
  ansible.builtin.command:
    argv: [kubectl, "--kubeconfig={{ kubeconfig_path }}", -n, "{{ tt_ns }}", rollout, status, "deployment/{{ item }}", --timeout=1800s]
  loop: "{{ tt_render_inventory.deployments }}"
  changed_when: false
