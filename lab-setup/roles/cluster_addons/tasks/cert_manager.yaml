---
- name: Add cert-manager Helm repo
  kubernetes.core.helm_repository:
    name: cert-manager
    repo_url: https://charts.jetstack.io

- name: Update cert-manager Helm repo
  ansible.builtin.command: >
    helm repo update cert-manager
  become: true
  changed_when: false

- name: Install cert-manager
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: cert-manager
    chart_ref: cert-manager/cert-manager
    chart_version: v1.16.3
    release_namespace: cert-manager
    create_namespace: true
    wait: true
    values:
      installCRDs: true
      prometheus:
        enabled: false
      config:
        apiVersion: controller.config.cert-manager.io/v1alpha1
        kind: ControllerConfiguration
        enableGatewayAPI: true

- name: Wait for cert-manager to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager
    namespace: cert-manager
    kubeconfig: "{{ kubeconfig_path }}"
  register: cert_manager_deploy
  until: >
    cert_manager_deploy.resources | length > 0 and
    (cert_manager_deploy.resources[0].status.readyReplicas | default(0)) >=
    (cert_manager_deploy.resources[0].spec.replicas | default(1))
  retries: 30
  delay: 10
