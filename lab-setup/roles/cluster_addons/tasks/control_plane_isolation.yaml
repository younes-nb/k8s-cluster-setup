---
# Isolate the control plane from the BENCHMARK while keeping it available to
# infrastructure and autoscaler pods.
#
# Two mechanisms, each doing a different job:
#
#   1. ``node-role.kubernetes.io/control-plane=:NoSchedule`` on the masters.
#      Kubernetes' own toleration for that taint is added by default to every
#      pod that does not specify a nodeSelector, which is why the masters were
#      previously untainted and the benchmark drifted onto them. Tainting them
#      restores the default: only pods that explicitly tolerate it (the control
#      plane itself, monitoring, the autoscalers) may run there.
#
#   2. ``lab.example.com/worker=true`` on the workers, which the rendered
#      TrainTicket manifests use as a nodeSelector. That is the hard guarantee
#      that the *workload* never lands on a master -- the taint alone would be
#      enough only as long as nothing tolerates it.
#
# The autoscaler controllers (PBScaler, AURORA, AURORA-R) are exempt by design:
# they belong with the control plane, not with the workload they are measuring.

- name: Taint the control-plane nodes NoSchedule
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ kubeconfig_path }} taint node {{ item }}
    node-role.kubernetes.io/control-plane=:NoSchedule --overwrite
  loop: "{{ control_plane_nodes }}"
  register: _taint
  changed_when: "'tainted' in _taint.stdout"

- name: Verify the taint is applied to every control-plane node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: v1
    kind: Node
    name: "{{ item }}"
  register: _tainted
  until: >-
    (_tainted.resources[0].spec.taints | default([]))
    | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane')
    | selectattr('effect', 'equalto', 'NoSchedule')
    | list | length > 0
  retries: 12
  delay: 5
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item }}"