---
# Grafana runs OUTSIDE the cluster on the `monitoring` host (playbook/
# monitoring.yaml). This task file is retired: the old version port-forwarded
# the in-cluster Grafana Service and imported a dashboard from a template that
# no longer exists.
#
# Datasources and dashboards are now provisioned declaratively by the
# monitoring role:
#   roles/monitoring/templates/grafana-datasources.yaml.j2
#   roles/monitoring/files/dashboards-provider.yaml
#   roles/monitoring/files/dashboards/*.json
#
# Nothing to do here. Kept as a no-op so an old `--tags monitoring` invocation
# does not fail with "file not found".

- name: Report that Grafana provisioning is handled by the monitoring host
  ansible.builtin.debug:
    msg: >-
      Grafana is off-cluster; datasources and the seven Research Lab dashboards
      are provisioned by roles/monitoring on {{ monitoring_host }}.