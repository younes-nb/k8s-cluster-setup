---
# ACME ClusterIssuer, used only for the public Grafana host.
#
# The application path is the Envoy Gateway VIP on a private L2 segment, which
# Let's Encrypt cannot reach, so the challenge stays pending on this LAN (a
# known, documented limitation). The issuer is still created so the certificate
# is correct on a cluster with public ingress.
- name: Apply the ACME ClusterIssuer
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_issuer_name }}"
      spec:
        acme:
          server: "{{ acme_server_url }}"
          email: "{{ acme_email }}"
          privateKeySecretRef:
            name: "{{ acme_private_key_secret }}"
          solvers:
            - http01:
                gatewayHTTPRoute:
                  parentRefs:
                    - name: "{{ gateway_public_cert_gateway | default('lab-envoy') }}"
                      namespace: "{{ gateway_namespace }}"
                      sectionName: http