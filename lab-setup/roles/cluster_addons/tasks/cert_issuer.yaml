---
- name: Apply ClusterIssuer
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_issuer_name }}"
      spec:
        acme:
          server: "{{ acme_server_url }}"
          email: "{{ acme_email }}"
          privateKeySecretRef:
            name: "{{ acme_private_key_secret }}"
          solvers:
            # The Gateway API HTTPRoute solver was removed: the in-namespace
            # Gateway CR is gone (the ingress is now the classic
            # istio-ingressgateway in {{ istio_ns }}). Note that the public
            # HTTPS host is not attainable on this private LAN either way --
            # Let's Encrypt cannot reach the challenge host, so the Certificate
            # stays pending (unchanged since 2026-11-18).
            - http01:
                ingress:
                  class: "{{ ingress_class }}"
