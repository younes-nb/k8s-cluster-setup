---
- name: Apply ClusterIssuer
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_issuer_name }}"
      spec:
        acme:
          server: "{{ acme_server_url }}"
          email: "{{ acme_email }}"
          privateKeySecretRef:
            name: "{{ acme_private_key_secret }}"
          solvers:
            - selector:
                dnsNames:
                  - "{{ tt_host }}"
              http01:
                gatewayHTTPRoute:
                  parentRefs:
                    - name: train-ticket-gateway
                      namespace: "{{ tt_ns }}"
                      kind: Gateway
            - http01:
                ingress:
                  class: "{{ ingress_class }}"
