[defaults]
inventory = ./inventory/host.yaml
roles_path = ./roles
# kubernetes.core lives in the repo-root collections dir (installed there by
# run-cluster-setup.sh); sans wrapper runs (cd lab-setup && ansible-playbook ...)
# must resolve it too. Relative to this ansible.cfg.
collections_paths = ../.ansible/collections:/usr/share/ansible/collections
connection = smart
timeout = 60
deprecation_warnings = False
host_key_checking = True
pipelining = True
forks = 100
interpreter_python = auto_silent

