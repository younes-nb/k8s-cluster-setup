all:
  children:
    # Kubernetes cluster nodes (kubespray inventory is separate, under
    # cluster-repo/kubespray). `loadgen` is the load generator.
    nodes:
      hosts:
        loadgen: {}
        master1: {}
        master2: {}
        master3: {}
        worker1: {}
        worker2: {}
        worker3: {}

    # Monitoring is a SEPARATE logical host from the load generator, because the
    # monitoring stack (Mimir / Loki / Tempo / Grafana) no longer runs inside the
    # cluster: it was moved off the masters so the TrainTicket benchmark can use
    # that memory. Keeping it a distinct group means it can later be moved to a
    # dedicated node by changing one variable.
    #
    # TODAY loadgen and monitoring are the SAME machine (pc491.emulab.net,
    # private 10.10.1.1). They are declared separately so the eventual split is
    # an inventory change, not a role rewrite. `monitoring_host` is the
    # private-network address the in-cluster Alloy scraper pushes to.
    monitoring:
      hosts:
        mon1:
          ansible_host: 10.10.1.1
      vars:
        monitoring_host: 10.10.1.1