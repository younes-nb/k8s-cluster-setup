kubeconfig_path: /etc/kubernetes/admin.conf
gateway_class: "istio"
gateway_nodeport_http: 30080
gateway_nodeport_https: 30081
gateway_api_crds_url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml"
ingress_class: "istio"
base_domain: "younesnb.linkpc.net"
storage_class: "local-path"

cert_issuer_name: "letsencrypt-http01"
acme_server_url: "https://acme-v02.api.letsencrypt.org/directory"
acme_email: "younesnikbin@gmail.com"
acme_private_key_secret: "le-account-key"

monitoring_ns: "monitoring"
prom_release_label: "prometheus-stack"
prom_repo_name: "prometheus-community"
prom_repo_url: "https://prometheus-community.github.io/helm-charts"
grafana_host: "grafana.{{ base_domain }}"
grafana_timezone: "Asia/Tehran"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_pvc_size: "20Gi"
istio_scrape_interval: "5s"

istio_ns: "istio-system"
istio_repo_name: "istio"
istio_repo_url: "https://istio-release.storage.googleapis.com/charts"
istio_git_repo: "https://github.com/istio/istio.git"
istio_git_branch: "release-1.30"
istio_version: "1.30.5"
istio_dash_tmp: "/tmp/istio-{{ istio_git_branch }}"
istio_dashboards_rel_path: "manifests/addons/dashboards"
istio_grafana_folder: "Istio"
istio_stats_inclusions:
  - '.*\.upstream_rq_active$'
  - '.*\.upstream_rq_pending_active$'
  - '.*\.upstream_rq_pending_overflow$'
  - '.*\.upstream_rq_timeout$'
  - '.*\.upstream_rq_retry$'
  - '.*\.no_healthy_upstream$'
  - '.*\.downstream_cx_active$'

tempo_image: "docker.io/grafana/tempo:3.0.3"
# Disk-pressure incident 2026-10-21: 336h retention with ~3 GB/h of OTLP at the
# 5s cadence filled worker3's tempo-data PV to 40G and triggered DiskPressure
# evictions. NOTE: storage-class local-path does NOT enforce PVC sizes — the
# retention window below is the real bound (values sized to measured ingest).
tempo_retention: "4h"   # ~= 12-14G resident on this 63G disk
tempo_pvc_size: "15Gi"
tempo_sampling_pct: 10.0

loki_image: "docker.io/grafana/loki:3.7.8"
loki_pvc_size: "10Gi"   # existing PV — do NOT resize (local-path rejects expansion); retention is the real bound
loki_retention: "6h"    # ~= 15G resident (was 336h -> 33G pile on master1)

mimir_image: "docker.io/grafana/mimir:3.2.1"
mimir_pvc_size: "50Gi"
mimir_retention: "18h"  # analytic window for post-run truth queries (was 720h -> unbounded, then 48h; disk-pressure 2026-10-23: 5s-cadence istio ingest ~16G/24h ~= 32G resident at 48h -> master3 hit 84% + taint; 18h ~= 12G resident)
mimir_max_series: 1000000
mimir_ingest_rate: 500000
mimir_ingest_burst: 2000000

alloy_image: "docker.io/grafana/alloy:v1.20.0"
alloy_scrape_interval: "5s"

beyla_image: "docker.io/grafana/beyla:3.37.0"

tt_ns: "train-ticket"
tt_repo_url: "https://github.com/FudanSELab/train-ticket.git"
tt_repo_version: "0.0.4"
tt_clone_dir: "/tmp/train-ticket"
tt_enable_istio_injection: true
tt_min_replicas: 1
tt_max_replicas: 10
tt_cpu_avg_utilization: 80
tt_host: "train-ticket.{{ base_domain }}"
tt_tls_secret: "trainticket-tls"
# Per-deployment readiness budget. 60 x 5s (5 min) was sometimes insufficient
# on fresh clusters: the first services to start pay all the image-pull cost,
# and app warmup (Spring Boot + DB connect) can exceed 5 min even after the
# image is cached — the pod then converges shortly after the wait gave up.
tt_wait_retries: 180
tt_wait_delay: 5
tt_mongo_image: "mongo:4.4"
tt_app_req_cpu: "500m"
tt_app_req_mem: "512Mi"
tt_app_lim_cpu: "2"
tt_app_lim_mem: "1Gi"
tt_db_lim_cpu: "1"
tt_db_lim_mem: "512Mi"
tt_java_tool_options: "-Xmx512m"
tt_db_pvc_size: "2Gi"
tt_mongo_data_path: "/data/db"
tt_mysql_data_path: "/var/lib/mysql"

