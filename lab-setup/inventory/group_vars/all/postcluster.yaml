          [ "$code" = 200 ]
      failureThreshold: 3
      periodSeconds: 5
      timeoutSeconds: 3
    startupProbe:
      exec:
        command:
        - /bin/sh
        - -ec
        - code=$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8848/nacos/actuator/health);
          [ "$code" = 200 ]
      failureThreshold: 120
      periodSeconds: 5
      timeoutSeconds: 3
  rabbitmq:
    readinessProbe:
      exec:
        command:
        - rabbitmq-diagnostics
        - -q
        - ping
      failureThreshold: 3
      periodSeconds: 5
      timeoutSeconds: 5
    startupProbe:
      exec:
        command:
