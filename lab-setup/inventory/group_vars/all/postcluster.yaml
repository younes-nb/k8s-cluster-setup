kubeconfig_path: /etc/kubernetes/admin.conf
gateway_api_crds_url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
envoy_gateway_version: v1.6.2
gateway_replicas: 3
gateway_namespace: envoy-gateway-system
metallb_version: v0.15.2
metallb_namespace: metallb-system
metallb_address_pool: '{{ gateway_private_ip }}/32'
storage_class: local-path
control_plane_nodes: "{{ groups['nodes'] | default([]) | select('search', '^master')\
  \ | list\n   or ['master1', 'master2', 'master3'] }}"
control_plane_taint: true
monitoring_ns: monitoring
prom_release_label: prometheus-stack
prom_repo_name: prometheus-community
prom_repo_url: https://prometheus-community.github.io/helm-charts
prom_stack_version: 79.8.2
alloy_image: docker.io/grafana/alloy:v1.20.0
alloy_scrape_interval: 5s
beyla_image: docker.io/grafana/beyla:3.37.0
tt_ns: train-ticket
tt_repo_url: https://github.com/FudanSELab/train-ticket.git
tt_repo_version: 0.0.4
tt_clone_dir: /tmp/train-ticket
tt_min_replicas: 1
tt_max_replicas: 10
tt_cpu_avg_utilization: 80
tt_wait_retries: 180
tt_wait_delay: 5
tt_mongo_image: mongo:4.4
tt_mysql_image: mysql:8.0
tt_db_pvc_size: 2Gi
tt_mongo_data_path: /data/db
tt_mysql_data_path: /var/lib/mysql
monitoring_host: '{{ cloudlab_private_ips.monitoring }}'
monitoring_mimir_port: 18080
monitoring_loki_port: 3100
monitoring_tempo_port: 3200
monitoring_grafana_port: 3000
monitoring_data_dir: /var/lib/monitoring
monitoring_disk_device: '{{ lookup(''env'', ''MONITORING_DISK_DEVICE'') }}'
tq_pods: '400'
tq_count_deployments: '100'
tq_count_replicasets: '400'
tt_probe_overrides: {}
monitoring_allow_format: '{{ lookup(''env'', ''MONITORING_ALLOW_FORMAT'') | default(''false'',
  true) | bool }}'
alloy_scrape_timeout: 4s
beyla_namespaces:
- train-ticket
tt_slo_seconds: 0.2
tt_require_verified_probes: true
monitoring_tempo_retention: 1440h
monitoring_profile_retention: 1440h
tt_mongodb_exporters: {}
tt_mysql_exporters: {}
tt_db_monitoring_required: true

