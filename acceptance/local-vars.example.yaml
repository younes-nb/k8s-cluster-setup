# Copy the verified values to lab-setup/inventory/group_vars/all/zz-local.yaml
# and encrypt it using Ansible Vault. Never commit the real credentials.
# Probe example is ONLY an illustration, NOT a verified Train Ticket endpoint.
tt_probe_overrides: {}
tt_require_verified_probes: true
tt_mongodb_exporters: {} # name -> mongodb://read-only-user:...@service.train-ticket.svc:27017/admin
tt_mysql_exporters: {} # name -> read-only-user:password@tcp(service.train-ticket.svc:3306)/
tt_db_monitoring_required: true
# load_testing_src: /absolute/path/to/pinned/research/load_testing


# Stable database credentials: set and encrypt locally; never rotate by redeploying.
# vault_nacos_db_password: ...
# vault_nacos_root_password: ...
# vault_ts_db_password: ...
# vault_ts_root_password: ...
# Infrastructure readiness overrides must be independently verified.
tt_infra_probe_overrides: {} # keys nacos, rabbitmq; readinessProbe/startupProbe
# tt_mysql_exporters must cover nacosdb-mysql and ts-mysql.

# Inspect rabbitmq-plugins list -e -m on the deployed image; preserve enabled plugins.
